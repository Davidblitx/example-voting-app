name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1
  CLUSTER_NAME: david-capstone-cluster
  RELEASE_NAME: voting-app
  # Trivy runs from a pinned container image instead of the trivy-action.
  # The action had its tags hijacked in March 2026 (CVE-2026-33634), and the kit used @master.
  # Before you finish, check Aqua's official advisory for the newest known-safe version.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.3

jobs:
  # ---------------------------------------------------------------------------
  # 1. Tests: bring the whole stack up and check that vote and result respond
  # ---------------------------------------------------------------------------
  test:
    name: Smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check vote and result pages respond
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080 > /dev/null
          curl --fail --silent --show-error --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8081 > /dev/null

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  # 2. Trivy scan (report only for now: exit-code 0 never fails the build)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan (vulnerabilities and secrets)
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" "$TRIVY_IMAGE" fs \
            --scanners vuln,secret \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --exit-code 0 \
            /src

  # ---------------------------------------------------------------------------
  # 3. Build, tag with the commit SHA, push to Docker Hub
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/examplevotingapp_${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/examplevotingapp_${{ matrix.service }}:latest

  # ---------------------------------------------------------------------------
  # 4. Deploy to EKS with Helm, using the commit SHA tag (never "latest")
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EKS (Helm)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Connect kubectl to the cluster
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"

      - name: Helm upgrade --install
        # global.tag overrides the image tag of vote, result and worker in the chart templates.
        run: |
          helm upgrade --install "$RELEASE_NAME" ./helm/voting-app \
            --set global.tag=${{ github.sha }} \
            --wait --timeout 5m

      - name: Show what is running
        run: kubectl get pods
