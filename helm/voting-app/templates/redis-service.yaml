apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.redis.service.type }}
  ports:
    - name: redis
      port: {{ .Values.redis.service.port }}
      targetPort: 6379
  selector:
    app: redis
